name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navegador para os testes e2e
        run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: check (astro check, tsc, unit, contraste HIG, guard)
        run: npm run check
      - name: build
        run: npm run build
      - name: e2e (blog + Studio; Playwright + axe + regras HIG)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
