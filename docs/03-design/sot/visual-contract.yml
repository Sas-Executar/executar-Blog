# Contrato visual (adaptado do pacote VISUAL-CONTRACT-BLOG-001 para as rotas do Astro/Starlight)
metadata: { id: VISUAL-CONTRACT-BLOG-001, version: 2.0.0, status: ACCEPTED, adr: ADR-017, supersedes: ADR-010 }
principles: [content_first, mobile_first, low_visual_noise, high_typographic_hierarchy, typography_space_divider_over_boxes, single_blue_accent, predictable_navigation]
reference: risco-cognitivo-executar-linkedin-v12-dark-mode.html (papel off-white, tinta, azul #0a66c2, filetes finos, sem sombras)
style_guide: /guia-de-estilo/
routes:
  - id: ROUTE-HOJE
    path: /
    golden_screen: SOT-MOCKUP-02-rota-hoje.png
    components: [LeadStory, StoryRow]
  - id: ROUTE-ARTIGO
    path: /artigos/<grupo>/<slug>/
    golden_screen: SOT-MOCKUP-05-rota-artigo.png
    components: [ArticleHero (PageTitle override)]
  - id: ROUTE-LEITURA
    path: /artigos/<grupo>/<slug>/#corpo
    golden_screen: SOT-MOCKUP-06-leitura-do-artigo.png
    components: [QuoteBlock (callout quote), TipCard (callout tip), Grafico (bloco chart), Próximos artigos (Pagination)]
  - id: ROUTE-GUIA
    path: /guia-de-estilo/
    components: [Cores, Tipografia, Espaço, Botao, Campo, Chip, Selo, Rotulo, CartaoEditorial, FamiliaEditorial, MoodBoard, Storyboard]
editorial_family: [callout, ponto-de-atencao, decisao, plain-txt-terminal, plain-txt, plain-txt-infografico, sumario, lista-numerada, pullquote]
deferred: []
